<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Start Learning - JavaMaster Academy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .header {
            background: #111a35;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #ff5a1f;
            font-weight: bold;
        }

        .course-title {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .course-title h2 {
            margin-bottom: 10px;
        }

        .lesson-list {
            display: grid;
            gap: 15px;
        }

        .lesson {
            background: white;
            padding: 20px;
            border-radius: 12px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .lesson h3 {
            margin-bottom: 5px;
        }

        .lesson p {
            color: #666;
        }

        .start-btn {
            background: #ff5a1f;
            color: white;
            text-decoration: none;

            padding: 10px 18px;
            border-radius: 8px;

            font-weight: bold;
        }

        .start-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .lesson {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>

</head>


<body>

    <header class="header">

        <h1>JavaMaster Academy</h1>

        <p>Start Learning Java</p>

    </header>


    <div class="container">

        <a href="index.html#courses" class="back">
            ← Back to Courses
        </a>


        <div class="course-title">

            <h2 id="courseTitle">
                Course
            </h2>

            <p id="courseDescription">
            </p>

        </div>


        <div class="lesson-list" id="lessonList">
        </div>

    </div>


    <script>

        const courses = {

            "java-basics": {

                title: "Java Programming Basics",

                description:
                    "Learn Java fundamentals from the beginning.",

                folder: "java-basics",

                lessons: [
                    "Introduction to Java",
                    "Variables & Data Types",
                    "Operators",
                    "Conditional Statements",
                    "Loops",
                    "Arrays",
                    "Methods & Functions",
                    "Strings"
                ]

            },


            "core-java": {

                title: "Core Java",

                description:
                    "Learn Object-Oriented Programming concepts in Java.",

                folder: "core-java",

                lessons: [
                    "OOP Introduction",
                    "Classes & Objects",
                    "Constructors",
                    "Inheritance",
                    "Polymorphism",
                    "Abstraction",
                    "Encapsulation",
                    "Interfaces"
                ]

            },


            "advanced-java": {

                title: "Advanced Java",

                description:
                    "Learn advanced Java concepts and database programming.",

                folder: "advanced-java",

                lessons: [
                    "Collections Framework",
                    "File Handling",
                    "Multithreading",
                    "JDBC & MySQL",
                    "Java + Database Project"
                ]

            }

        };


        const params =
            new URLSearchParams(window.location.search);


        const courseId =
            params.get("course");


        const course =
            courses[courseId];


        if (course) {

            document.getElementById("courseTitle").textContent =
                course.title;


            document.getElementById("courseDescription").textContent =
                course.description;


            const lessonList =
                document.getElementById("lessonList");


            course.lessons.forEach((lesson, index) => {

                const lessonNumber = index + 1;


                lessonList.innerHTML += `

                    <div class="lesson">

                        <div>

                            <h3>
                                Lesson ${lessonNumber}: ${lesson}
                            </h3>

                            <p>
                                Learn ${lesson}
                            </p>

                        </div>


                        <a
                            class="start-btn"
                            href="${course.folder}/lesson${lessonNumber}.html">

                            Start Lesson

                        </a>

                    </div>

                `;

            });

        }

    </script>

</body>

</html>
